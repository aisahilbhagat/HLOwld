[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hlowld"
version = "0.1.0"
description = "Portable Language Manager"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "questionary>=2.0",
]

[project.scripts]
hlowld = "hlowld.cli:main"

[tool.setuptools.packages.find]
include = ["hlowld", "hlowld.*"]

[tool.setuptools.package-data]
hlowld = ["bin/*"]
