[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hlowld"
version = "0.1.0"
description = "Portable Language Manager"
requires-python = ">=3.10"
dependencies = [
    "rich",
    "questionary",
]

[project.scripts]
hlowld = "hlowld.cli:main"


[tool.setuptools]
packages = ["hlowld"]